schema_version: 1
release_version: v2026.10.16

# One ordered list produces all three language sections.
# Only landed changes belong here; pending project proposals are excluded.
changes:
  - id: optional-offline-pdfs
    category: maintenance
    zh-TW: Release 預設只發布三語版本說明，不再要求每次產出 PDF。本版不附 PDF；需要離線教材時，才選擇一次產出完整三語附件。保留選用轉檔的中文粗體修正、表格與程式碼回歸檢查。
    zh-Hans: Release 默认只发布三语版本说明，不再要求每次生成 PDF。本版不附 PDF；需要离线教材时，才选择一次生成完整三语附件。保留可选转换的中文粗体修正、表格与代码回归检查。
    en: Releases now default to trilingual notes without PDFs. This release has no PDF attachments; offline editions are an explicit all-three-language opt-in. Optional conversion retains the CJK bold fix and table/code regression checks.
    links:
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/actions
  - id: current-model-guidance
    category: learning-content
    zh-TW: Stage 1 更新 Haiku 5.5（claude-haiku-5-5）的 API、分級價格與 Sonnet 快取價格。Gemini 4 Argon（gemini-4-argon）改列正式 API，並更新 Muse、Mistral 與 Jev 的狀態和限制。Ollama 起點不變；舊範例保留明示的相容界線。
    zh-Hans: Stage 1 更新 Haiku 5.5（claude-haiku-5-5）的 API、分级价格与 Sonnet 缓存价格。Gemini 4 Argon（gemini-4-argon）改列正式 API，并更新 Muse、Mistral 与 Jev 的状态和限制。Ollama 起点不变；旧示例保留明确的兼容边界。
    en: Stage 1 updates the Haiku 5.5 API (claude-haiku-5-5), tiered prices and Sonnet cache pricing. Gemini 4 Argon (gemini-4-argon) is now listed as a generally available API; Muse, Mistral and Jev status and limits are refreshed. The Ollama starting point and explicit compatibility boundaries for older examples remain.
    links:
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/312
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/321
  - id: readable-model-reference
    category: reader-experience
    zh-TW: 三語模型詳表改為 18 個家族的收合入口，各用兩欄表閱讀。型號分行、相同欄名真正合併，手機不再擠八欄。規格、價格條件、官方來源與原查核日期完整保留；必讀與評分資源仍展開。
    zh-Hans: 三语模型详表改为 18 个家族的折叠入口，各用两列表格阅读。型号分行、相同栏名真正合并，手机不再挤八列。规格、价格条件、官方来源与原核查日期完整保留；必读与评分资源仍展开。
    en: The model reference becomes 18 closed family entries with two-column tables. Model variants use separate rows and genuinely merged field labels instead of eight cramped columns on mobile. Specifications, price conditions, official sources and scoped review dates remain; required reading and rated resources stay visible.
    links:
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/324
  - id: memory-and-skills-routes
    category: learning-content
    zh-TW: 三語新增 Hindsight、OpenViking 與 Vercel Skills 的學習入口。保留編輯星等，說清記憶測試、授權、安裝信任與匿名使用紀錄限制；完整 repository 快照一併更新。
    zh-Hans: 三语新增 Hindsight、OpenViking 与 Vercel Skills 的学习入口。保留编辑星级，说明记忆测试、授权、安装信任与匿名使用记录限制；完整 repository 快照一并更新。
    en: Three-language learning routes add Hindsight, OpenViking and Vercel Skills. Editorial ratings remain, with explicit memory-test, license, installation-trust and anonymous-usage-record limits. The complete repository snapshot is refreshed.
    links:
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/322
  - id: focused-free-course-electives
    category: learning-content
    zh-TW: "加入 Hugging Face Context Course 與 LangChain Project: Deep Agents。13 筆課程保持展開與合併分類，分清免費教材、模型費用與證書條件；同步修正三語 NVIDIA NIM 入口。"
    zh-Hans: "加入 Hugging Face Context Course 与 LangChain Project: Deep Agents。13 项课程保持展开与合并分类，区分免费教材、模型费用与证书条件；同步修正三语 NVIDIA NIM 入口。"
    en: "Add Hugging Face Context Course and LangChain Project: Deep Agents. All 13 courses stay visible in merged category groups, distinguishing free materials, model costs and certificate conditions. The NVIDIA NIM entrance is corrected across all three locales."
    links:
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/323
  - id: safer-cli-and-local-exercises
    category: learning-content
    zh-TW: CLI 路線補上升級後的安全重驗與穩定版入口。Stage 1 的本機練習檢查空白或截斷回覆，附可操作的排錯方式；不把產生部分文字當成完成。
    zh-Hans: CLI 路线补上升级后的安全复验与稳定版入口。Stage 1 的本地练习检查空白或截断回复，附可操作的排错方法；不把生成部分文本当成完成。
    en: The CLI route adds post-upgrade safety rechecks and stable-release entrances. Stage 1 local exercises guard empty or truncated responses and provide actionable troubleshooting instead of treating partial text as completion.
    links:
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/313
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/315
  - id: agent-interface-reference-and-anchors
    category: learning-content
    zh-TW: Stage 8 收錄 Cortex，說明它如何把 API spec 變成 typed MCP tools，並保留 gRPC 僅提供 schema 資源的限制。恢復三語舊資源錨點，避免既有深連結失效。
    zh-Hans: Stage 8 收录 Cortex，说明它如何把 API spec 变成 typed MCP tools，并保留 gRPC 仅提供 schema 资源的限制。恢复三语旧资源锚点，避免已有深链接失效。
    en: Stage 8 adds Cortex for turning API specifications into typed MCP tools, retaining the limitation that gRPC supplies schema resources rather than callable methods. Legacy resource anchors are restored across all three locales.
    links:
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/318
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/319
  - id: coherent-readme-and-rendering
    category: reader-experience
    zh-TW: 清理主頁三語重複的 CLI／MCP 定義，更新評測入口。文件解析器與閱讀驗證鎖定同一版 Markdown 3.11，修正核心詞顯示成星號的問題，並加入實際渲染回歸測試。
    zh-Hans: 清理主页三语重复的 CLI／MCP 定义，更新评测入口。文档解析器与阅读验证锁定同一版 Markdown 3.11，修正核心词显示成星号的问题，并加入实际渲染回归测试。
    en: Remove detached duplicate CLI/MCP definitions from the three-language README and refresh evaluation entrances. Documentation and reader checks share pinned Markdown 3.11, fixing literal asterisks around core terms with real rendering regressions.
    links:
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/304
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/311
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/320
  - id: source-license-and-action-maintenance
    category: maintenance
    zh-TW: 依上游原文修正七組資源的授權界線，避免把 source-available 或企業目錄說成完全相同的開源授權。同步更新附件上傳／下載 Actions 的固定版本；未通過策展條件的提案不列入本版。
    zh-Hans: 根据上游原文修正七组资源的授权边界，避免把 source-available 或企业目录说成完全相同的开源授权。同步更新附件上传／下载 Actions 的固定版本；未通过策展条件的提案不列入本版。
    en: Clarify seven resource license boundaries using upstream text, distinguishing source-available terms and enterprise directories from blanket open-source claims. Pinned artifact upload/download Actions are updated. Proposals that have not passed curation are excluded.
    links:
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/310
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/316
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/317
